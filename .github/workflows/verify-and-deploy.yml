name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: knowledge-base-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache PDF cover previews
        uses: actions/cache@v6
        with:
          path: .cache/pdf-previews
          key: pdf-previews-${{ hashFiles('uploads/**/*.pdf', 'uploads/**/*.PDF') }}

      - name: Ensure PDF cover renderer
        run: command -v pdftoppm || (sudo apt-get update && sudo apt-get install -y poppler-utils)

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build site
        run: npm run docs:build

      - name: Check internal links
        run: npm run test:links

      - name: Check site size budget
        run: npm run test:size

      - name: Check critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Upload browser report on failure
        if: failure() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
